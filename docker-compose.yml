services:
  nginx:
    image: nginx:alpine
    container_name: php_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html # Mount application code for Nginx to serve static files
      - ./_docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Nginx configuration
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: _docker/php/Dockerfile
    container_name: php_app
    volumes:
      - ./:/var/www/html # Mount application code for PHP-FPM
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: php_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root # CHANGE THIS
      MYSQL_DATABASE: php_demo # CHANGE THIS (match config/database.php)
      MYSQL_USER: php_demo # CHANGE THIS (match config/database.php)
      MYSQL_PASSWORD: php_demo # CHANGE THIS (match config/database.php)
    volumes:
      - mysql_data:/var/lib/mysql # Persistent data volume
    networks:
      - app-network

  cli:
    build:
      context: .
      dockerfile: _docker/php/Dockerfile
    container_name: php_cli
    volumes:
      - ./:/var/www/html
    networks:
      - app-network
    command: "tail -f /dev/null" # Keep container running for manual commands

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: php_phpmyadmin
    ports:
      - "8080:80" # Access phpMyAdmin on http://localhost:8080
    environment:
      PMA_HOST: mysql # Connect to the mysql service
      MYSQL_ROOT_PASSWORD: root # CHANGE THIS (match mysql service)
    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  mysql_data: # Define the named volume for MySQL data

networks:
  app-network:
    driver: bridge
