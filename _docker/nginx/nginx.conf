server {
    listen 80;
    index index.php index.html;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public; # Serve from the public directory

    location / {
        try_files $uri $uri/ @php_fpm; # If not a file or directory, go to @php_fpm
    }

    location @php_fpm {
        # This block handles all requests that are not static files or directories
        # and passes them to index.php via PHP-FPM
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php; # Always point to index.php
        fastcgi_param PATH_INFO $uri; # Pass the original URI as PATH_INFO
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri; # Ensure original request URI is passed
    }

    location ~ \.php$ {
        # This block handles direct access to .php files (e.g., /some.php)
        # It's usually not needed for front-controller apps, but good to have.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }
}
